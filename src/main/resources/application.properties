spring.application.name=university-academic-system

# PostgreSQL connection (create the database first: CREATE DATABASE university_academic_db;)
spring.datasource.url=jdbc:postgresql://localhost:5432/university_academic_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
